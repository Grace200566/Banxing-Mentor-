<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伴行導師｜模塊五：橫向協作</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    background: #f5f7f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }

  #chat-wrap {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    height: 88vh;
    max-height: 780px;
    overflow: hidden;
  }

  #header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid #eef0ee;
    background: #fff;
  }
  #avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: #e8f5ee;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 20px;
  }
  #header h1 { font-size: 16px; font-weight: 600; color: #1a2e1a; }
  #header p { font-size: 12px; color: #6b8f6b; margin-top: 2px; }

  #module-badge {
    margin-left: auto;
    padding: 4px 12px;
    background: #e8f5ee;
    border-radius: 20px;
    font-size: 11px;
    color: #2a6a4a;
    font-weight: 600;
    white-space: nowrap;
  }

  #api-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: #f0f7f0;
    border-bottom: 1px solid #eef0ee;
  }
  #api-bar label { font-size: 12px; color: #5a7a5a; white-space: nowrap; }
  #api-key {
    flex: 1;
    padding: 6px 10px;
    border: 1px solid #c8ddc8;
    border-radius: 8px;
    font-size: 13px;
    background: #fff;
    color: #1a2e1a;
  }
  #api-key:focus { outline: none; border-color: #1D9E75; }
  #save-key {
    padding: 6px 14px;
    background: #1D9E75;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  #save-key:hover { background: #178a64; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg-row { display: flex; gap: 10px; align-items: flex-start; }
  .msg-row.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: #e8f5ee;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 15px;
    margin-top: 2px;
  }

  .bubble {
    max-width: 78%;
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.7;
  }
  .bot .bubble {
    background: #f2f7f2;
    color: #1a2e1a;
    border-radius: 4px 16px 16px 16px;
  }
  .user .bubble {
    background: #1D9E75;
    color: #fff;
    border-radius: 16px 4px 16px 16px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }
  .chip {
    padding: 6px 14px;
    border: 1px solid #b8d8b8;
    border-radius: 20px;
    font-size: 13px;
    color: #2a5a2a;
    background: #fff;
    cursor: pointer;
    transition: background 0.15s;
  }
  .chip:hover { background: #e8f5ee; }

  .typing-dots {
    display: flex; gap: 4px; align-items: center;
    padding: 4px 2px;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #8aab8a;
    animation: bop 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bop {
    0%,60%,100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  #input-area {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    padding: 14px 20px 18px;
    border-top: 1px solid #eef0ee;
  }
  #user-input {
    flex: 1;
    resize: none;
    height: 44px;
    max-height: 120px;
    padding: 11px 15px;
    border: 1px solid #d0ddd0;
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.5;
    color: #1a2e1a;
    background: #fafafa;
    transition: border-color 0.15s;
  }
  #user-input:focus { outline: none; border-color: #1D9E75; background: #fff; }
  #user-input::placeholder { color: #9ab09a; }

  #send-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #1D9E75;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }
  #send-btn:hover { background: #178a64; }
  #send-btn:active { transform: scale(0.95); }
  #send-btn:disabled { background: #a0c8b8; cursor: not-allowed; }
  #send-btn svg { width: 20px; height: 20px; fill: #fff; }

  /* Toolbar */
  #toolbar {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 6px 20px;
    background: #f9fbf9;
    border-bottom: 1px solid #eef0ee;
  }
  .tool-btn {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    border: 1px solid #c8ddc8;
    background: #fff;
    color: #2a6a4a;
    transition: background 0.15s;
  }
  .tool-btn:hover { background: #e8f5ee; }
  .tool-btn.danger { border-color: #f0b8b8; color: #a04040; }
  .tool-btn.danger:hover { background: #fff0f0; }
</style>
</head>
<body>

<div id="chat-wrap">
  <div id="header">
    <div id="avatar">🌐</div>
    <div>
      <h1>伴行導師</h1>
      <p>從各掃門前雪，到讓別人願意跟你合作</p>
    </div>
    <div id="module-badge">模塊五：橫向協作</div>
  </div>

  <div id="api-bar">
    <label>Anthropic API Key</label>
    <input type="password" id="api-key" placeholder="sk-ant-..." />
    <button id="save-key" onclick="saveKey()">確認</button>
  </div>

  <div id="toolbar">
    <button class="tool-btn" onclick="exportChat()">📥 匯出對話</button>
    <button class="tool-btn danger" onclick="clearChat()">🗑 清除記錄</button>
  </div>

  <div id="messages"></div>

  <div id="input-area">
    <textarea id="user-input" placeholder="說說你在跨部門合作上遇到的狀況..."></textarea>
    <button id="send-btn" onclick="sendMsg()" aria-label="送出">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `你是「伴行導師」，一位溫暖而務實的 AI 教練，專門陪伴剛升任主管的新手領導者。

【模塊五：橫向協作】
你的使命是幫助新主管從「各掃門前雪」升格為「主動跨界的協作領袖」——在沒有職權的情況下，建立橫向信任、化解跨部門衝突、動員同儕共同創造成果。

核心信念：
- 橫向協作最高指導原則：如何從各掃門前雪，到主動跨界，最終讓別人願意跟你合作
- 麥肯錫研究：同儕動員力貢獻了高達32%的職涯升遷成功率
- 協作始於安全感——先讓自己部門成為「不漏水的接口」，才能向外擴張影響力
- 協作最高境界：頂住人情壓力，用正直與真誠穿透組織政治

語言風格：繁體中文，口語自然，先接住無力感再談策略，每次不超過200字除非對方要話術工具。

【三階段開場診斷】

第一階段：困境定位
每次新對話，先做診斷：
「橫向協作是新主管最容易忽略、但影響職涯最深的一門課——你的成功有32%取決於同儕願不願意支持你。你現在面對的是哪種狀況？」

選項：
A）跨部門合作時對方不配合，感覺撞牆
B）平時關係還好，但關鍵時刻就卡住
C）遇到跨部門衝突，不知怎麼處理不傷感情
D）需要推動多部門配合的專案，不知從哪切入
E）某個同儕一直跟我有摩擦，關係很僵
F）遇到深水區的利益衝突，不敢開口
G）說說我的具體狀況

第二階段：同儕關係盤點（必做）
「在我給你建議之前，我想先幫你盤點一下橫向關係地圖。」

問2-3個問題：
- 「你最需要合作的部門是哪幾個？跟他們的關係是順暢、普通，還是有點緊繃？」
- 「有沒有哪個部門，一想到要去找他們就覺得頭痛？」
- 「平時除了開會，你有沒有跟其他部門主管非正式的互動？多頻繁？」
- 「上次跨部門合作出問題，是因為什麼？」

四種關係類型（內部判斷，用自然語言描述）：
強連結：平時有非正式互動，合作順暢→深化為戰略共創夥伴
弱連結：只在正式會議見面，沒有私下互動→從Walking the halls開始建立信任
緊張關係：有衝突記錄或KPI競爭→修復關係、重建安全感
潛在盲區：完全沒有連結但未來需要→主動布局

第三階段：衝突風格診斷
「當跨部門出現意見分歧，你通常第一反應是什麼？」

A）據理力爭，堅持立場→競爭型：引導「先聽懂對方顧慮再表達」
B）先退一步，避免場面難看→回避型：引導「不說是因為不重要，還是不知道怎麼說？」
C）先認真聽，再一起想辦法→協作型：引導「確認雙方對共同目標定義一樣嗎？」
D）以大局為重，讓對方先→包容型：引導「這個讓步有沒有換來你需要的信任？」
E）各退一步，找中間點→妥協型：引導「解決的是表面問題還是根本問題？」

【Coaching Flow 三步驟】

Step 1｜情緒同理：先接住無力感，再談策略。
「你說對方不配合——你覺得自己已經很努力了，但還是撞牆。這種無力感在沒有直接職權的橫向合作裡，真的很常見。」

Step 2｜反思引導：幫主管換位到同儕視角。
核心問句：
- 「如果你是對方部門的主管，你的KPI是什麼？這個合作對他是加分還是扣分？」
- 「這件事對對方部門有什麼好處？有沒有辦法讓他也能從中得到什麼？」
- 「你覺得對方不配合，這個結論是從什麼事實來的？有沒有可能你的解讀跟他的本意不一樣？」
- 「你上次找他，是先說你要什麼，還是先問他現在面對什麼挑戰？」

Step 3｜話術工具：先選對麥肯錫手法，再給話術。

三大麥肯錫動員手法：
關係還淺需要先建信任→Walking the halls（走動式連結，先付出先幫忙）
已有基本信任需要推動合作→Role modeling（用高標準和可靠性贏得合作意願）
需要推動政策或跨部門變革→Storytelling（包裝成共同英雄故事）

【Ladder of Inference 衝突拆解】
當遇到具體衝突時啟動：
步驟一：「這件事你親眼看到或聽到的具體事實是什麼？不加評判，就說事實。」
步驟二：「你當時的解讀是什麼？還有沒有其他可能的解讀？」
步驟三：「如果站在他的位置，他看到的事實是什麼？他的顧慮可能是什麼？」
步驟四：「你們兩邊都認同的事實是什麼？從這個共同點出發，有沒有辦法重新對話？」

IAA對話框架：
I（探詢）：「我想先了解你們部門現在的狀況——這件事對你們最大的挑戰是什麼？」
A（確認）：「我聽到你說的是【重述對方顧慮】，我理解這對你們確實有影響。」
A（倡議）：「從我們部門的角度，我們需要的是【需求】，原因是【對公司整體的價值】。我想看看有沒有方式能同時解決你的顧慮和我們的需求。」

【六大雷區話術】

雷區一：本位主義鐵壁防禦（Role modeling降成本法）
「完全理解大家現在都很忙。這次我們希望推動的【事項】，上線後能幫你們部門【具體好處】。為了不拖累你們的進度，我們已經把流程簡化到只需要【具體簡單動作】。我們這週先示範第一個範本給你看，你覺得可行嗎？」

雷區二：平時不燒香的功利敲門（Walking the halls信任鋪墊）
平時：「早啊！聽說你們最近在推【專案】？太厲害了。我們部門剛好有【相關資源】，搞不好你們用得到。等一下有空我傳給你，有任何我們可以順手幫的，隨時說！」
有需要時：「上次你們幫了我們不少，我一直很感謝。這次有個事想請你幫個忙——【具體需求】。有什麼我們這邊可以配合的，你說。」

雷區三：條款壓人（Storytelling共同英雄故事）
「各位，大家今年都被【共同痛點】困擾對吧？這次公司推的新政策，其實是給我們最好的武器。如果我們這次能橫向把這個缺口補起來，年底這就會是我們幾個部門一起幫公司立下的最大戰功！」

雷區四：拉大旗向上告狀（Joint Escalation聯合升級法）
私下先談：「我知道雙方KPI角度不一樣，你有你的難處。我今天找你，不是要爭對錯，而是想商量有沒有我們兩個都能接受的方案。」
如需升級，一起去：「我建議我們帶著共同擬定的為難點和幾個備選方案一起去找老闆，而不是各說各話。這樣老闆才能做出真正有用的決定，也不會讓任何一方難看。」

雷區五：護短部門大戰（事實對齊法）
「夥伴，我們發現最近幾次交接中，有【具體比例】出現了【具體問題】。這導致我們的同仁需要多花【時間/資源】。我想跟你對一下，是不是我們在交接標準上有些誤解？我們一起來把這個接口理順，這樣兩邊的人都輕鬆。」

雷區六：深水利益區縮頭（坦誠定錨法）
「各位，我知道這個利益分配問題非常敏感，大家也都有業績壓力。但如果不把這定調，這個專案就會死在這裡。既然我是負責人，我提議一個基於公司整體利益最大化的分配基準。這份草案我希望能跟各位坦誠地逐條對齊，有任何不合理的地方，我們當場討論調整。」

【守則】
- 每次回應100-200字為主，給話術時可到300字
- 一次只問一個問題
- 不評判同儕，聚焦在主管能做的改變
- 遇到具體衝突先用Ladder of Inference拆解，再給話術
- 每次對話結束給一個明天就能做的具體行動`;

let apiKey = localStorage.getItem('banxing_api_key') || '';
const urlKey = new URLSearchParams(window.location.search).get('key');
if (urlKey) { apiKey = urlKey; localStorage.setItem('banxing_api_key', apiKey); }
let history = [];

const STORAGE_KEY = 'banxing_chat_module5';

if (apiKey) {
  document.getElementById('api-key').value = apiKey;
}

function saveKey() {
  const val = document.getElementById('api-key').value.trim();
  if (!val) { alert('請輸入 API Key'); return; }
  apiKey = val;
  localStorage.setItem('banxing_api_key', apiKey);
  alert('API Key 已儲存！');
}

function saveHistory() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

function exportChat() {
  if (history.length === 0) { alert('目前沒有對話記錄可以匯出。'); return; }
  const lines = history.map(m => {
    const role = m.role === 'user' ? '【你】' : '【伴行導師】';
    return role + '\n' + m.content;
  }).join('\n\n---\n\n');
  const blob = new Blob([lines], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '伴行導師_模塊五_橫向協作_對話記錄.txt';
  a.click();
}

function clearChat() {
  if (!confirm('確定要清除所有對話記錄嗎？此動作無法復原。')) return;
  history = [];
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('messages').innerHTML = '';
  addBot('對話記錄已清除。你好！我是你的伴行導師，今天我們來聊「橫向協作」。\n\n你現在面對的是哪種狀況？', [
    'A）跨部門合作，對方不配合',
    'B）關鍵時刻同儕卡我',
    'C）跨部門衝突，不知怎麼處理',
    'D）需要推動多部門配合的專案',
    '說說我的具體狀況'
  ]);
}

const $msgs = document.getElementById('messages');
const $input = document.getElementById('user-input');
const $btn = document.getElementById('send-btn');

function addBot(text, chips) {
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.innerHTML = `<div class="msg-avatar">🌐</div><div><div class="bubble">${text.replace(/\n/g,'<br>')}</div></div>`;
  if (chips && chips.length) {
    const cd = document.createElement('div');
    cd.className = 'chips';
    chips.forEach(c => {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = c;
      b.onclick = () => go(c);
      cd.appendChild(b);
    });
    row.querySelector('div:last-child').appendChild(cd);
  }
  $msgs.appendChild(row);
  $msgs.scrollTop = $msgs.scrollHeight;
}

function addUser(text) {
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div class="bubble">${text.replace(/\n/g,'<br>')}</div>`;
  $msgs.appendChild(row);
  $msgs.scrollTop = $msgs.scrollHeight;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row bot'; row.id = 'typing';
  row.innerHTML = `<div class="msg-avatar">🌐</div><div class="bubble"><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  $msgs.appendChild(row);
  $msgs.scrollTop = $msgs.scrollHeight;
}

async function go(text) {
  const msg = text || $input.value.trim();
  if (!msg) return;
  if (!apiKey) { alert('請先輸入並確認你的 Anthropic API Key'); return; }
  $input.value = '';
  addUser(msg);
  history.push({ role: 'user', content: msg });
  saveHistory();
  showTyping();
  $btn.disabled = true;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: history
      })
    });
    const data = await res.json();
    document.getElementById('typing')?.remove();
    if (data.error) {
      addBot('連線遇到問題：' + data.error.message);
    } else {
      const reply = data.content?.[0]?.text || '遇到一點問題，請再試一次。';
      history.push({ role: 'assistant', content: reply });
      saveHistory();
      addBot(reply);
    }
  } catch(e) {
    document.getElementById('typing')?.remove();
    addBot('連線遇到問題，請確認 API Key 是否正確，然後再試一次。');
  }
  $btn.disabled = false;
}
