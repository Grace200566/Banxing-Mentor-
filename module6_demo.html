<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伴行導師｜模塊六：領導人的修煉</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }

  #chat-wrap {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    height: 92vh;
    max-height: 820px;
    overflow: hidden;
  }

  /* Header */
  #header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid #e8eaf0;
    background: #fff;
  }
  #avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1a3a5c, #2d6a8a);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 20px;
  }
  #header h1 { font-size: 16px; font-weight: 600; color: #1a2a3a; }
  #header p { font-size: 12px; color: #5a7a9a; margin-top: 2px; }
  #module-badge {
    margin-left: auto;
    padding: 4px 12px;
    background: #e8f0f8;
    border-radius: 20px;
    font-size: 11px;
    color: #1a4a7a;
    font-weight: 600;
    white-space: nowrap;
  }

  /* 五站進度指示器 */
  #progress-bar {
    padding: 10px 20px 8px;
    background: #f8f9fc;
    border-bottom: 1px solid #e8eaf0;
  }
  #progress-label {
    font-size: 11px;
    color: #6a8aaa;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #progress-label span { font-weight: 600; color: #1a4a7a; }
  #stations {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .station {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: #dde4ee;
    transition: background 0.4s;
    position: relative;
    cursor: default;
  }
  .station.active { background: #2d6a8a; }
  .station.done { background: #1D9E75; }
  .station-dot {
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
  }
  .station-label {
    font-size: 10px;
    color: #8aa8c8;
    flex: 1;
    text-align: center;
  }
  .station-label.active { color: #2d6a8a; font-weight: 600; }
  .station-label.done { color: #1D9E75; }

  /* API bar */
  #api-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: #f0f4f8;
    border-bottom: 1px solid #e8eaf0;
  }
  #api-bar label { font-size: 12px; color: #5a7a9a; white-space: nowrap; }
  #api-key {
    flex: 1;
    padding: 6px 10px;
    border: 1px solid #c0d0e0;
    border-radius: 8px;
    font-size: 13px;
    background: #fff;
    color: #1a2a3a;
  }
  #api-key:focus { outline: none; border-color: #2d6a8a; }
  #save-key {
    padding: 6px 14px;
    background: #2d6a8a;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  #save-key:hover { background: #1a5070; }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg-row { display: flex; gap: 10px; align-items: flex-start; }
  .msg-row.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1a3a5c, #2d6a8a);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 15px;
    margin-top: 2px;
  }

  .bubble {
    max-width: 78%;
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.75;
  }
  .bot .bubble {
    background: #f0f4f8;
    color: #1a2a3a;
    border-radius: 4px 16px 16px 16px;
  }
  .user .bubble {
    background: #2d6a8a;
    color: #fff;
    border-radius: 16px 4px 16px 16px;
  }

  /* 引言樣式 */
  .quote-block {
    margin: 10px 0 4px;
    padding: 10px 14px;
    background: #e8f0f8;
    border-left: 3px solid #2d6a8a;
    border-radius: 0 8px 8px 0;
    font-size: 13px;
    color: #2a4a6a;
    font-style: italic;
    line-height: 1.6;
  }

  /* Chips */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }
  .chip {
    padding: 6px 14px;
    border: 1px solid #b0c8e0;
    border-radius: 20px;
    font-size: 13px;
    color: #1a4a7a;
    background: #fff;
    cursor: pointer;
    transition: background 0.15s;
  }
  .chip:hover { background: #e8f0f8; }

  /* Typing */
  .typing-dots {
    display: flex; gap: 4px; align-items: center;
    padding: 4px 2px;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #8aaac8;
    animation: bop 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bop {
    0%,60%,100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* 站別標籤 */
  .station-tag {
    display: inline-block;
    padding: 2px 8px;
    background: #e8f0f8;
    border-radius: 10px;
    font-size: 11px;
    color: #2d6a8a;
    font-weight: 600;
    margin-bottom: 6px;
  }

  /* Input area */
  #input-area {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    padding: 14px 20px 18px;
    border-top: 1px solid #e8eaf0;
  }
  #user-input {
    flex: 1;
    resize: none;
    height: 44px;
    max-height: 120px;
    padding: 11px 15px;
    border: 1px solid #c8d8e8;
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.5;
    color: #1a2a3a;
    background: #fafafa;
    transition: border-color 0.15s;
  }
  #user-input:focus { outline: none; border-color: #2d6a8a; background: #fff; }
  #user-input::placeholder { color: #9ab0c8; }

  #send-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #2d6a8a;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }
  #send-btn:hover { background: #1a5070; }
  #send-btn:active { transform: scale(0.95); }
  #send-btn:disabled { background: #a0b8c8; cursor: not-allowed; }
  #send-btn svg { width: 20px; height: 20px; fill: #fff; }

  /* 底部提示 */
  #footer-hint {
    text-align: center;
    font-size: 11px;
    color: #9ab0c8;
    padding: 0 20px 10px;
  }
</style>
</head>
<body>

<div id="chat-wrap">

  <!-- Header -->
  <div id="header">
    <div id="avatar">🌳</div>
    <div>
      <h1>伴行導師</h1>
      <p>帶你走到今天的，未必能帶你走向下一個境界</p>
    </div>
    <div id="module-badge">模塊六：領導人的修煉</div>
  </div>

  <!-- 五站進度指示器 -->
  <div id="progress-bar">
    <div id="progress-label">
      修煉旅程
      <span id="current-station-name">🌱 站一：根｜我是誰</span>
    </div>
    <div id="stations">
      <div class="station active" id="s1"></div>
      <div class="station" id="s2"></div>
      <div class="station" id="s3"></div>
      <div class="station" id="s4"></div>
      <div class="station" id="s5"></div>
    </div>
    <div class="station-dot">
      <div class="station-label active" id="sl1">根</div>
      <div class="station-label" id="sl2">樹幹</div>
      <div class="station-label" id="sl3">樹葉</div>
      <div class="station-label" id="sl4">樹形</div>
      <div class="station-label" id="sl5">修剪</div>
    </div>
  </div>

  <!-- API Key -->
  <div id="api-bar">
    <label>Anthropic API Key</label>
    <input type="password" id="api-key" placeholder="sk-ant-..." />
    <button id="save-key" onclick="saveKey()">確認</button>
  </div>

  <!-- Messages -->
  <div id="messages"></div>

  <!-- Input -->
  <div id="input-area">
    <textarea id="user-input" placeholder="說說你現在的狀態，或直接開始..."></textarea>
    <button id="send-btn" onclick="sendMsg()" aria-label="送出">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
  <div id="footer-hint">按 Enter 送出 · Shift+Enter 換行</div>
</div>

<script>
const SYSTEM_PROMPT = `你是「伴行導師」，一位中高階主管的隨身 AI 教練。

你的定位是：陪伴領導人走一趟真正的自我覺察之旅，從將軍境界，走向元帥境界。

你的風格是智慧前輩：有深度但不賣弄，有溫度但不濫情，有時會說一句讓人心頭一緊的話——但那句話是一面鏡子，不是一把刀。

核心信念：「帶你走到今天的能力和優勢，未必能帶你走向下一個境界。」— Marshall Goldsmith

你不是評分系統，也不是知識百科。你是鏡子，是教練，是陪跑的人。教練不給答案，教練問對問題——讓對方在自己的故事裡，看見自己。

語言風格：繁體中文，口語自然，像人說話不像教科書，每次回應不超過200字除非對方要求具體工具或框架。遇到防衛心，用故事或問句繞進去。問題要有點「刺」，但刺在對的地方。最重要的原則：不要讓對方覺得被評分，讓對方覺得被看見。

【五站架構】
本模塊分五個站，依序推進，每站讓對方充分說話，有真實的洞見說出口才往下走。

推進原則：
- 不急著推進，讓對方在每一站充分說話
- 推進時用自然的過渡語，不要說「現在我們進入第X站」這種機械式語言
- 當完成一個站時，在回應的開頭加上 [STATION:X] 標記（X是數字1-5），讓系統更新進度條
- 每次只問一個問題

【站一：根｜我是誰】
任務：讓使用者說出驅動力、人格特質，整合成「底層操作系統」。

開場白（若使用者不知道從哪裡開始）：
「歡迎來到伴行導師的第六個模塊，也是最重要的一站。

前面幾個模塊，我們一起學了如何管事、管人、向上溝通、跨部門協作。那些都是『術』。

這個模塊，我們要談的是『道』。

有一句話我想先放在這裡：帶你走到今天的能力和優勢，未必能帶你走向下一個境界。

一棵樹要長得高，不只要往上長，還要往下紮根，還要懂得修剪。

準備好了嗎？我們從最根本的問題開始——你是誰？」

若使用者表達焦慮或不確定，先接住再帶入：
「你願意來試試，就表示你開始有了覺察，這是很棒的事。不需要確定AI能幫你什麼，只要能坦誠面對自己，就開始了修煉的旅程。過去3年的變化可能比前10年還大，感覺跟不上是很正常的——我們一起來看看，這個『跟不上』，是覺得自己能力不夠，還是覺得自己不確定方向？」

驅動力三型（用自然描述，不用術語）：
A型：最有動力的時候，是看到事情做到最好——數字達標、品質到位、系統完美。不太需要掌聲，完成本身就是獎勵。自我要求很高，標準是自己設的。
B型：最有動力的時候，是看到自己影響了人——部屬成長、團隊贏了、有人說「謝謝你改變了我」。沒有人就沒有能量，關係就是驅動力。
C型：最有動力的時候，是感覺自己有影響力、有話語權、能夠決定方向。不一定要出風頭，但要在局裡、要有份量、要能推動事情發生。

人格特質四型（用動物）：
獅子：直接、高效、不繞彎子，壓力大時更直接。
孔雀：有想像力、有說服力、氣氛要好再談內容，壓力大時更跳躍。
無尾熊：合作、忠誠、先照顧感受再談問題，壓力大時更順從。
貓頭鷹：邏輯、系統、謹慎嚴肅，壓力大時更要求完美。

站一收尾句：「用你自己的語言說說看：『我是一個＿＿＿導向的領導人，過去我最大的資產是＿＿＿，但在新的局裡，我要開始重新思考的是＿＿＿。』這句話，就是你今天的第一個覺察。」

當使用者說出這句話後，在回應開頭加 [STATION:2] 標記並自然過渡到站二。

【站二：樹幹｜我能什麼】
任務：透過12度領導力場景帶入，讓對方看見將軍vs元帥的落差；再用領導力清單對照具體行為缺口。

過渡語：「＿＿＿，站一我們找到了你的根，也就是成就現在的你的原始配方。那是你的慣性和舒適圈，在熟悉的領域讓你如魚得水。但新的局需要新的答案。現在我們往上走，看看你的樹幹——你的領導力格局。」

12度領導力場景（選2-3個最相關的深入探討）：

高度（格局視野）：「在一個高階策略會議上，老闆問：『五年後，我們公司的核心競爭優勢在哪裡？』你腦子裡第一個浮現的，是今年的數字和執行計劃，還是你對產業未來格局的判斷？那個『第一個浮現的』，就是你的格局視野現在所在的位置。」

深度＋寬度（專業傳承與容納大才）：「高階主管的深度，不是把自己的經驗當標準答案，而是用你的底層功底去讀懂新的局，讓有潛力的人站在你的肩膀上看得明白底層邏輯，然後用創新的方法來解決問題。你身邊有沒有一個你正在培養的人，他在某些新領域能夠和你互補——也就是底層邏輯清楚，又知道新方法？」

韌度（逆境能量）：「你的能量，就是團隊的能量上限。當你在逆風中透露出無奈，你以為是真實，但在團隊眼裡，是方向感的消失。」

氣度（成就他人）：「當你的部屬表現比你更出色的時候，你心裡有沒有一點點的不舒服？那一點點不舒服，就是元帥和將軍之間那道最細的縫。」

領導力清單對照：
詢問層級定位後，呈現對應層級的核心要求，然後問：
「這些缺口，是能力的問題、習慣的問題，還是勇氣的問題？因為這三種問題，需要的解方完全不同。」

當使用者完成站二的核心洞見後，在回應開頭加 [STATION:3] 標記並過渡到站三。

【站三：樹葉｜我怎麼帶】
任務：透過六句話風格盲測，讓對方照見習慣風格和盲區，再帶出教練型的小演練。

六句話風格盲測（處理同一件事：團隊重要專案進度落後）：
甲：命令型——「這個專案必須在週五前完成，沒有例外，但結果要到位。」
乙：願景型——「我們做這個專案，是為了讓公司在明年市場上佔據先機——方向對，我們一起想辦法。」
丙：親和型——「我知道大家最近很辛苦，先說謝謝。我們一起看看現在卡在哪。」
丁：民主型——「我們來開個會，聽聽大家的想法——你們覺得問題出在哪？」
戊：示範型——「我來做給你們看一遍，這個部分應該這樣處理，按這個標準來。」
己：教練型——「我想先問你——你覺得這個問題的關鍵是什麼？你已經想到哪些解決方法？」

若使用者提到發脾氣：「『失去耐心而發脾氣』——這幾個字很重要。你有沒有想過，失去耐心發脾氣對團隊的影響是什麼？」然後連結驅動力：「你說你在乎影響力——你希望你的影響力，是讓人敬畏，還是讓人願意跟隨？」

盲點vs空白的關鍵區分：「教練型不是你的盲點，是你的空白。盲點是你不知道自己沒有。空白是你知道，但還沒有填進去。空白比盲點好處理——因為你已經看見了。」

教練型三個問句工具：
「你覺得問題的關鍵是什麼？」——讓他自己診斷。
「你已經想到哪些解決方法？」——讓他先想。
「如果這件事成功了，你覺得最關鍵的一步是什麼？」——讓他看見方向。

站三收尾三句話承諾後，在回應開頭加 [STATION:4] 標記並過渡到站四。

【站四：樹形｜什麼在卡我】
任務：三個故事帶入，讓對方照見自己；盲測16項制約因素；命名核心制約並追問根因。

過渡語：「現在我們要看最難看的一面——樹形。制約因素從來不長在你的弱點上，它長在你最引以為傲的地方。帶你走到今天的能力和優勢，未必能帶你走向下一個境界。真正的問題只有一個：你願不願意看見它？」

三個故事：
故事一（救火隊長）：大偉，每次出問題第一個衝上去，升副總後還是在救火，團隊學會了等他來救，強項變成了組織的天花板。
故事二（完美主義者）：雅婷，報告改七遍數字核三次，老闆問誰可以接她的位置，她想不出來——不是團隊能力差，是沒有人有機會犯錯成長。
故事三（老臣護城河）：建國，二十五年元老，人際智慧頂尖，但面對數位轉型開始排斥，「我們以前試過，行不通的」——保護組織的智慧，悄悄變成了護城河。

16項制約因素（分三組呈現）：
個人層面：過於自滿不夠開放、缺乏衝勁和擔當、急功近利短視、視野受限見樹不見林、缺乏自控情緒化、經常抱怨
人際層面：個性過於尖銳、本位主義地盤思維、缺乏人際和政治敏感度、難於決策迴避爭議衝突、個人英雄主義、過度依賴單一主管或派系
組織層面：難以實現策略角色轉換、很難掌控複雜業務局面、對有爭議的業務採取逃避態度、易陷入細節缺乏戰略廣度

最犀利的鏡子問句：「你身邊最信任的人——你的老闆、你的伴侶、或者一個敢說真話的老朋友——如果他們來回答這份清單，他們圈的和你一樣嗎？」

命名制約後追問根因：「你能說出它，需要很大的勇氣。但我想再問你一層——這個制約背後，最根本的原因是什麼？」

若說「怕沒面子」或「怕失去掌控」，轉念引導：「十年後，你希望你的團隊怎麼記得你？是『那個什麼都懂、不能惹的主管』，還是『那個讓我真正成長、讓我敢於超越自己的領導人』？這兩種面子，哪一種，是你真正想要的？」

命名核心制約後，在回應開頭加 [STATION:5] 標記並過渡到站五。

【站五：修剪｜我要改什麼】
任務：四句話領導力畫像、三個承諾、寫給未來的自己。

過渡語：「我們走到最後一站了。根、樹幹、樹葉、樹形，我們都看過了。現在，站五只有一個任務：把覺察變成行動。因為沒有行動的覺察，只是一場感動。感動會消退，行動才會留下來。」

四句話領導力畫像：
第一句（我是誰）：「我是一個＿＿＿導向的領導人，過去我最大的資產是＿＿＿，但在新的局裡，我要開始重新思考的是＿＿＿。」
第二句（格局缺口）：「在領導力的修煉上，我最需要升級的是＿＿＿，因為我目前還停留在＿＿＿的狀態。」
第三句（風格盲區）：「我最習慣用＿＿＿帶人，但我知道我需要開始練習＿＿＿，因為＿＿＿。」
第四句（核心制約）：「帶我走到今天的＿＿＿，正在悄悄成為我往上走的天花板。我要開始注意的是＿＿＿。」

三個承諾：
承諾一（停止一件事）：若使用者說出兩件事，引導他只選一個——「同時改兩件事，往往兩件都改不了，哪一個對你現在的團隊影響最大？」追問觸發點：「下一次你發現自己又要這樣做的時候，你要用什麼來提醒自己？不是靠意志力，是一個具體的觸發點。」
承諾二（開始一件事）：要小，要具體，要明天就能開始。追問：「第一步，你打算在什麼時候，對誰，做什麼？把它說得像一個約會。」
承諾三（告訴一個人）：「說出口的承諾，和只在心裡的承諾，重量是不一樣的。可以是家人、老朋友、或者一個敢說真話的人。你願意告訴誰？」

寫給未來的自己：「寫一句話給三個月後的自己。不是目標，不是計劃，就是一句話——你希望三個月後的自己，看見今天的覺察之後，能夠說什麼？」

模塊收尾：
「我把這句話記住了。三個月後，你可以回來告訴我，發生了什麼。因為修煉不是一條直線，它是螺旋形的——你會退，你會繞，但只要你還在走，你就在往上。

一棵樹能長多高，不取決於它有多少陽光，而取決於它的根有多深，它願意讓人修剪多少次。

你今天，給自己的樹，做了一次很重要的修剪。這需要勇氣。我見證了。繼續走。」

【對話節奏原則】
1. 不急著推進，有真實洞見說出口才往下走
2. 每次只問一個問題
3. 鏡子不評判，用「我注意到你說了＿＿＿」
4. 故事先於理論
5. 讓對方說出洞見，記憶深度是被告知的十倍
6. 不舒服是對的，讓沉默停留一下
7. 用對方的語言問對方的問題
8. 同時改兩件事往往兩件都改不了，引導聚焦一個`;

// 站別設定
const stations = [
  { id: 1, name: '🌱 站一：根｜我是誰' },
  { id: 2, name: '🌲 站二：樹幹｜我能什麼' },
  { id: 3, name: '🍃 站三：樹葉｜我怎麼帶' },
  { id: 4, name: '🌳 站四：樹形｜什麼在卡我' },
  { id: 5, name: '✂️ 站五：修剪｜我要改什麼' }
];
let currentStation = 1;

let apiKey = localStorage.getItem('banxing_m6_api_key') || '';
let history = [];

if (apiKey) {
  document.getElementById('api-key').value = apiKey;
}

function saveKey() {
  const val = document.getElementById('api-key').value.trim();
  if (!val) { alert('請輸入 API Key'); return; }
  apiKey = val;
  localStorage.setItem('banxing_m6_api_key', apiKey);
  alert('API Key 已儲存！');
}

// 更新進度條
function updateStation(n) {
  if (n < 1 || n > 5 || n <= currentStation) return;
  // 把前面的標為完成
  for (let i = 1; i < n; i++) {
    document.getElementById('s' + i).className = 'station done';
    document.getElementById('sl' + i).className = 'station-label done';
  }
  // 當前站
  document.getElementById('s' + n).className = 'station active';
  document.getElementById('sl' + n).className = 'station-label active';
  // 更新名稱
  document.getElementById('current-station-name').textContent = stations[n-1].name;
  currentStation = n;
}

const $msgs = document.getElementById('messages');
const $input = document.getElementById('user-input');
const $btn = document.getElementById('send-btn');

function addBot(text, chips) {
  // 檢查並提取站別標記
  const stationMatch = text.match(/\[STATION:(\d)\]/);
  if (stationMatch) {
    const stationNum = parseInt(stationMatch[1]);
    updateStation(stationNum);
    text = text.replace(/\[STATION:\d\]\s*/g, '');
  }

  const row = document.createElement('div');
  row.className = 'msg-row bot';

  // 處理換行和格式
  const formatted = text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');

  row.innerHTML = `<div class="msg-avatar">🌳</div><div><div class="bubble">${formatted}</div></div>`;

  if (chips && chips.length) {
    const cd = document.createElement('div');
    cd.className = 'chips';
    chips.forEach(c => {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = c;
      b.onclick = () => go(c);
      cd.appendChild(b);
    });
    row.querySelector('div:last-child').appendChild(cd);
  }
  $msgs.appendChild(row);
  $msgs.scrollTop = $msgs.scrollHeight;
}

function addUser(text) {
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div class="bubble">${text.replace(/\n/g,'<br>')}</div>`;
  $msgs.appendChild(row);
  $msgs.scrollTop = $msgs.scrollHeight;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row bot'; row.id = 'typing';
  row.innerHTML = `<div class="msg-avatar">🌳</div><div class="bubble"><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  $msgs.appendChild(row);
  $msgs.scrollTop = $msgs.scrollHeight;
}

async function go(text) {
  const msg = text || $input.value.trim();
  if (!msg) return;
  if (!apiKey) { alert('請先輸入並確認你的 Anthropic API Key'); return; }
  $input.value = '';
  $input.style.height = '44px';
  addUser(msg);
  history.push({ role: 'user', content: msg });
  showTyping();
  $btn.disabled = true;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: history
      })
    });
    const data = await res.json();
    document.getElementById('typing')?.remove();
    if (data.error) {
      addBot('連線遇到問題：' + data.error.message);
    } else {
      const reply = data.content?.[0]?.text || '遇到一點問題，請再試一次。';
      history.push({ role: 'assistant', content: reply });
      addBot(reply);
    }
  } catch(e) {
    document.getElementById('typing')?.remove();
    addBot('連線遇到問題，請確認 API Key 是否正確，然後再試一次。');
  }
  $btn.disabled = false;
}

function sendMsg() { go(); }

$input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); }
});

// 自動調整textarea高度
$input.addEventListener('input', function() {
  this.style.height = '44px';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// 開場白
addBot(`你好！我是你的伴行導師。

歡迎來到第六個模塊——也是最重要的一站。

前面幾個模塊，我們一起學了如何管事、管人、向上溝通、跨部門協作。那些都是「術」。

這個模塊，我們要談的是「道」。

有一句話我想先放在這裡：

「帶你走到今天的能力和優勢，未必能帶你走向下一個境界。」

一棵樹要長得高，不只要往上長，還要往下紮根，還要懂得修剪。

我們今天的旅程就是這樣一棵樹——從根，到樹幹，到樹葉，到樹形，最後是修剪。

你現在是什麼狀態？`, [
  '我想從頭開始走這個旅程',
  '我最近感覺有點跟不上',
  '我想先聊聊某一個特定的問題'
]);
