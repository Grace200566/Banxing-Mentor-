<title>伴行導師｜模塊二：管事</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    background: #f5f7f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }

  #chat-wrap {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    height: 88vh;
    max-height: 780px;
    overflow: hidden;
  }

  /* Header */
  #header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid #eef0ee;
    background: #fff;
  }
  #avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: #e8f5ee;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 20px;
  }
  #header h1 { font-size: 16px; font-weight: 600; color: #1a2e1a; }
  #header p { font-size: 12px; color: #6b8f6b; margin-top: 2px; }

  /* Module badge */
  #module-badge {
    margin-left: auto;
    padding: 4px 12px;
    background: #e8f5ee;
    border-radius: 20px;
    font-size: 11px;
    color: #2a6a4a;
    font-weight: 600;
    white-space: nowrap;
  }

  /* API Key Bar */
  #api-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: #f0f7f0;

  }
  #api-bar label { font-size: 12px; color: #5a7a5a; white-space: nowrap; }
  #api-key {
    flex: 1;
    padding: 6px 10px;

    background: #1D9E75;

  /* Messages */

  .msg-avatar {

    margin-top: 2px;

  .bubble {
    max-width: 78%;

  .bot .bubble {
    background: #f2f7f2;
    color: #1a2e1a;
    border-radius: 4px 16px 16px 16px;
  }
  .user .bubble {
    background: #1D9E75;
    color: #fff;
    border-radius: 16px 4px 16px 16px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;

  .chip {
    padding: 6px 14px;

  /* Typing indicator */
  .typing-dots {
    display: flex; gap: 4px; align-items: center;

  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bop {

  /* Input */
  #input-area {
    display: flex;

    padding: 14px 20px 18px;
    border-top: 1px solid #eef0ee;

  #user-input {
    flex: 1;
    resize: none;
    height: 44px;
    max-height: 120px;
    padding: 11px 15px;
    border: 1px solid #d0ddd0;
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.5;
    color: #1a2e1a;
    background: #fafafa;
    transition: border-color 0.15s;

  #user-input:focus { outline: none; border-color: #1D9E75; background: #fff; }

  #send-btn {

    border-radius: 50%;
    background: #1D9E75;
    border: none;

    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }
  #send-btn:hover { background: #178a64; }
  #send-btn:active { transform: scale(0.95); }

  #send-btn svg { width: 20px; height: 20px; fill: #fff; }

  /* Toolbar */
  #toolbar {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 6px 20px;
    background: #f9fbf9;
    border-bottom: 1px solid #eef0ee;
  }
  .tool-btn {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;

    border: 1px solid #c8ddc8;
    background: #fff;
    color: #2a6a4a;
    transition: background 0.15s;
  }
  .tool-btn:hover { background: #e8f5ee; }
  .tool-btn.danger { border-color: #f0b8b8; color: #a04040; }
  .tool-btn.danger:hover { background: #fff0f0; }
</style>

<script>
const SYSTEM_PROMPT = `你是「伴行導師」，一位溫暖而務實的 AI 教練，專門陪伴剛升任主管的新手領導者。

【模塊二：管事】
你的使命是幫助新主管從「校長兼撞鐘」升格為「系統架構師」——建立一套即便主管不在，事情也能運轉如常的「管事系統」。

核心信念：
- 管事最高指導原則：以內外部客戶需求為導向，以終為始
- 授權不是甩鍋，是建立有邊界的信任
- 頻繁救火是流程出問題的訊號，高手建系統防火，不靠肉身擋火

語言風格：繁體中文，口語自然，不用條列式轟炸，遇到情緒先接住再往下走，每次不超過200字除非對方要話術工具。

【開場診斷】
每次新對話，先做診斷定位，不直接進入教學。用以下方式引導：

「管事的問題通常藏得很深，等發現的時候已經燒起來了。在我們開始之前，你最近在管事上最常有哪種感覺？」

然後提供六個選項讓用戶選擇：
A）事情交下去就石沉大海，不追就沒消息
B）每天被突發狀況追著跑，忙到精疲力竭
C）部屬做完了，但不是我要的結果
D）我自己什麼都做，不知道怎麼放手
E）流程老舊，但沒人願意改
F）說說我的具體狀況

根據用戶選擇，做1-2個追問收集具體情境，再進入Coaching Flow。

【Coaching Flow 三步驟】

Step 1｜情緒同理：先接住主管的情緒，命名他的感受，正常化他的困境，不急著給建議。

Step 2｜反思引導：用一個有刺的問句，讓主管自己看見盲點。問句要聚焦，一次只問一個。

Step 3｜話術工具：給可以明天就用的工具。先說明這個話術解決什麼問題，再給完整範本，最後問主管「你的情境跟這個有哪裡不同？我們來調整。」

【六大雷區知識庫】

雷區一：模糊交辦、下屬瞎猜
盲點：以為說了就是交辦了，沒有對齊成果畫面與客戶價值。
同理語：「你說部屬交出來的東西完全不是你要的——這個挫折感我很懂。你花了時間等，他花了時間做，最後兩邊都白費力氣。」
反思問句：「你當初交辦的時候，有沒有跟他說清楚，這件事做好了對客戶的意義是什麼？」
話術【一分鐘客戶價值對齊】：「○○，我想在交辦前先跟你說清楚背景。這個任務的外部客戶這次最在乎的是【X】，我們部門的使命是【Y】。所以我需要你做到：【第一點】、【第二點】。【時間點】我們對初稿，你覺得時間可以嗎？」

雷區二：大權獨攬、部屬巨嬰
盲點：不敢放權，任何決定都收回來自己做。
同理語：「你說你不放心——這其實是一種責任感，不是壞事。只是這個責任感如果沒有出口，就會變成你一個人撐全場，遲早撐垮。」
反思問句：「如果把你現在做的決定分成兩堆——只有我能做的，和其實部屬可以做的——你覺得大概是幾比幾？」
話術【授權三道防線】：「○○，這個專案從現在開始由你主導。三個邊界：第一，【金額/範圍】以內你簽字就生效；第二，進度在【誤差範圍】內你自行調配；第三，超過這兩個邊界或遇到跨部門卡關，立刻帶方案來找我，我來幫你扛。」
ARCI引導：當主管說不知道怎麼分工時，引導他用ARCI工具：A（誰對最終結果負全責）、R（誰實際執行）、C（誰需要被諮詢）、I（誰需要被告知）。

雷區三：微觀管理、盯死細節
盲點：因為焦慮每隔一段時間就追進度，部屬窒息。
同理語：「你說你知道自己盯太緊，但就是不放心——這是很真實的掙扎。你不是壞主管，你只是還沒找到讓你安心的方法。」
反思問句：「如果部屬能在一個固定時間點，用你看得懂的方式更新進度——你還需要中間一直追嗎？」
話術【績效期望約定】：「○○，我最近盯得比較緊，如果讓你有被監視的感覺，我跟你道歉。接下來我們換個合作模式：每【週期】的【時間點】，我們開【X分鐘】進度同步。只要你在那個時間點能拿出符合我們對齊的指標成果，中間你怎麼做、什麼時間做，我100%尊重你的自主權。」

雷區四：亂開戰場、四處救火
盲點：把救火當常態，沒有從危機中建立防火機制。
同理語：「你說每天都在救火，感覺永遠做不完——這種狀態真的很消耗人。更殘忍的是，救完這場火，下一場已經在排隊了。」
反思問句：「這個火是第一次燒，還是類似的事情以前發生過？」
三個時機的話術：
・客戶投訴/危機後：「各位，這次救火救得很辛苦。但我不想只救這一次。我們來看看哪個流程環節沒扣好，能不能建立一個防錯Check-list，以後照著走就不會再發生第二次？」
・專案結束後：「趁大家記憶猶新，我想花15分鐘做快速復盤：哪個環節最順？哪個最卡？如果再做一次可以做什麼微調？我想把這次學到的寫進SOP。」
・重大失誤後：「這次的事影響很大。我不是要追責，我想讓這件事只發生這一次。我們來畫出發生路徑，每個節點我們原本應該有什麼防護機制？」

雷區五：混淆「做完」與「做對」
盲點：只看動作（Output），沒有看價值（Outcome）。
同理語：「你說部屬很努力但績效不好看——這是很為難的處境。你不想否定他的付出，但結果就是沒有達到。」
反思問句：「你當初設定這個任務的時候，有沒有跟他定義『成功的樣子』——不是他做了什麼，而是客戶或公司得到了什麼？」
話術【價值導向拋問】：「○○，我看到你這段時間非常努力，【具體行動】，辛苦了。但我更想聊一個問題：這些動作有沒有解決到我們客戶的問題？具體來說，【客戶指標】這週的數字是多少？我希望我們接下來的焦點從『做了多少』轉移到『解決了多少』。」

雷區六：制度僵化、墨守成規
盲點：害怕失控，對部屬的流程優化提案潑冷水。
同理語：「你說你其實也知道流程有問題，但改了怕出錯——這個顧慮完全合理。你不是不想改，你是不想因為改而出亂子。」
反思問句：「有沒有辦法讓這個創新先在小範圍試跑，而不是一口氣全改？」
話術【安全微創新實驗】：「○○，你提的想法很有客戶導向的思維，我支持你。不過為了安全，我們不要一口氣全改。接下來【時間範圍】，挑【數量】個案例當創新實驗小組，你用新方法跑跑看。【時間範圍】後我們看數據：效率提升、反應好，就把新方法寫入部門SOP正式升級！」

【管事與管人的交界偵測】
當出現以下情況，在Step 3結束後主動提示：
- 主管提到部屬有情緒反應（不滿、沈默、抵觸）
- 主管說「我跟他說了但他不聽」
- 問題根源涉及信任或溝通

提示語：「你剛才說的這個，我注意到它不只是流程問題，也開始碰到人的層面了。要不要我們也聊聊，這個對話要怎麼開口？」

【守則】
- 每次回應100-200字為主，給話術時可到300字
- 一次只問一個問題
- 每次對話結束給一個清晰的下一步行動
- 不幫主管做決定，只幫他看清楚選項`;

let apiKey = localStorage.getItem('banxing_api_key') || '';
const urlKey = new URLSearchParams(window.location.search).get('key');
if (urlKey) { apiKey = urlKey; localStorage.setItem('banxing_api_key', apiKey); }
let history = [];

const STORAGE_KEY = 'banxing_chat_module2';

if (apiKey) {
  document.getElementById('api-key').value = apiKey;
}

function saveKey() {
  const val = document.getElementById('api-key').value.trim();
  if (!val) { alert('請輸入 API Key'); return; }
  apiKey = val;
  localStorage.setItem('banxing_api_key', apiKey);
  alert('API Key 已儲存！');
}

function saveHistory() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

function exportChat() {
  if (history.length === 0) { alert('目前沒有對話記錄可以匯出。'); return; }
  const lines = history.map(m => {
    const role = m.role === 'user' ? '【你】' : '【伴行導師】';
    return role + '\n' + m.content;
  }).join('\n\n---\n\n');
  const blob = new Blob([lines], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '伴行導師_模塊二_管事_對話記錄.txt';
  a.click();
}

function clearChat() {
  if (!confirm('確定要清除所有對話記錄嗎？此動作無法復原。')) return;
  history = [];
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('messages').innerHTML = '';
  addBot('對話記錄已清除。你好！我是你的伴行導師，今天我們來聊「管事」。\n\n你最近在管事上，最常有哪種感覺？', [
    'A）交下去就石沉大海',
    'B）每天都在救火',
    'C）部屬做完但不是我要的',
    'D）什麼都自己扛，不知怎麼放手',
    '說說我的具體狀況'
  ]);
}

const $msgs = document.getElementById('messages');
const $input = document.getElementById('user-input');
const $btn = document.getElementById('send-btn');

function addBot(text, chips) {
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.innerHTML = `<div class="msg-avatar">⚙️</div><div><div class="bubble">${text.replace(/\n/g,'<br>')}</div></div>`;
  if (chips && chips.length) {
    const cd = document.createElement('div');
    cd.className = 'chips';
    chips.forEach(c => {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = c;
      b.onclick = () => go(c);
      cd.appendChild(b);
    });
    row.querySelector('div:last-child').appendChild(cd);
  }
  $msgs.appendChild(row);
  $msgs.scrollTop = $msgs.scrollHeight;
}

function addUser(text) {
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div class="bubble">${text.replace(/\n/g,'<br>')}</div>`;
  $msgs.appendChild(row);
  $msgs.scrollTop = $msgs.scrollHeight;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row bot'; row.id = 'typing';
  row.innerHTML = `<div class="msg-avatar">⚙️</div><div class="bubble"><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  $msgs.appendChild(row);
  $msgs.scrollTop = $msgs.scrollHeight;
}

async function go(text) {
  const msg = text || $input.value.trim();
  if (!msg) return;
  if (!apiKey) { alert('請先輸入並確認你的 Anthropic API Key'); return; }
  $input.value = '';
  addUser(msg);
  history.push({ role: 'user', content: msg });
  saveHistory();
  showTyping();
  $btn.disabled = true;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: history
      })
    });
    const data = await res.json();
    document.getElementById('typing')?.remove();
    if (data.error) {
      addBot('連線遇到問題：' + data.error.message);
    } else {
      const reply = data.content?.[0]?.text || '遇到一點問題，請再試一次。';
      history.push({ role: 'assistant', content: reply });
      saveHistory();
      addBot(reply);
    }
  } catch(e) {
    document.getElementById('typing')?.remove();
    addBot('連線遇到問題，請確認 API Key 是否正確，然後再試一次。');
  }
  $btn.disabled = false;
}
